name: Scala-Transformers CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 1.8
      uses: actions/setup-java@v5
      with:
        java-version: 8.0.202+8
        distribution: liberica
    - name: Setup sbt
      uses: sbt/setup-sbt@v1
      with:
        sbt-runner-version: 1.12.9
    - name: Run tests
      run: sbt +test
