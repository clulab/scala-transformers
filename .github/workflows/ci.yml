name: Scala-Transformers CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 1.8
      uses: actions/setup-java@v1
      with:
        java-version: 1.8
    - name: Setup sbt
      uses: sbt/setup-sbt@v1
      with:
        sbt-version: 1.7.1
    - name: Run tests
      run: sbt +test
